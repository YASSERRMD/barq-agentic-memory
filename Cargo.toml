[workspace]
resolver = "2"
exclude = [
    "crates/bindings/memory-bindings-python",
    "crates/bindings/memory-bindings-node",
]
members = [
    "crates/memory-domain",
    "crates/memory-provider-api",
    "crates/memory-core",
    "crates/providers/provider-local",
    "crates/providers/provider-postgres",
    "crates/providers/provider-redis",
    "crates/providers/provider-pgvector",
    "crates/memory-retrieval",
    "crates/memory-server",
    "sdks/rust",
    "crates/memory-reliability",
    "crates/memory-workers",
    "crates/memory-testkit",
    "crates/memory-classifier",
    "crates/memory-dedup",
    "crates/memory-conflict",
    "crates/memory-episodic",
    "crates/memory-graph",
    "crates/memory-procedural",
    "crates/memory-prospective",
    "crates/memory-lifecycle",
    "crates/memory-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/YASSERRMD/barq-agentic-memory"
rust-version = "1.85"

[workspace.dependencies]
memory-domain = { path = "crates/memory-domain", version = "0.1.0" }
memory-provider-api = { path = "crates/memory-provider-api", version = "0.1.0" }
provider-local = { path = "crates/providers/provider-local", version = "0.1.0" }
provider-postgres = { path = "crates/providers/provider-postgres", version = "0.1.0" }
provider-redis = { path = "crates/providers/provider-redis", version = "0.1.0" }
memory-retrieval = { path = "crates/memory-retrieval", version = "0.1.0" }
memory-core = { path = "crates/memory-core", version = "0.1.0" }
memory-server = { path = "crates/memory-server", version = "0.1.0" }
memory-reliability = { path = "crates/memory-reliability", version = "0.1.0" }
memory-workers = { path = "crates/memory-workers", version = "0.1.0" }
memory-testkit = { path = "crates/memory-testkit", version = "0.1.0" }
memory-classifier = { path = "crates/memory-classifier", version = "0.1.0" }
memory-dedup = { path = "crates/memory-dedup", version = "0.1.0" }
memory-conflict = { path = "crates/memory-conflict", version = "0.1.0" }
memory-episodic = { path = "crates/memory-episodic", version = "0.1.0" }
memory-graph = { path = "crates/memory-graph", version = "0.1.0" }
memory-procedural = { path = "crates/memory-procedural", version = "0.1.0" }
memory-prospective = { path = "crates/memory-prospective", version = "0.1.0" }
memory-lifecycle = { path = "crates/memory-lifecycle", version = "0.1.0" }
memory-policy = { path = "crates/memory-policy", version = "0.1.0" }
provider-pgvector = { path = "crates/providers/provider-pgvector", version = "0.1.0" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tracing = { version = "0.1", features = ["std"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
