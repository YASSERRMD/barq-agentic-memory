[workspace]
resolver = "2"
members = [
    "crates/memory-domain",
    "crates/memory-provider-api",
    "crates/memory-core",
    "crates/providers/provider-local",
    "crates/providers/provider-postgres",
    "crates/providers/provider-redis",
    "crates/providers/provider-pgvector",
    "crates/memory-retrieval",
    "crates/memory-classifier",
    "crates/memory-dedup",
    "crates/memory-conflict",
    "crates/memory-episodic",
    "crates/memory-graph",
    "crates/memory-procedural",
    "crates/memory-prospective",
    "crates/memory-lifecycle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/YASSERRMD/barq-agentic-memory"
rust-version = "1.85"

[workspace.dependencies]
memory-domain = { path = "crates/memory-domain" }
memory-provider-api = { path = "crates/memory-provider-api" }
provider-local = { path = "crates/providers/provider-local" }
provider-postgres = { path = "crates/providers/provider-postgres" }
provider-redis = { path = "crates/providers/provider-redis" }
memory-retrieval = { path = "crates/memory-retrieval" }
memory-classifier = { path = "crates/memory-classifier" }
memory-dedup = { path = "crates/memory-dedup" }
memory-conflict = { path = "crates/memory-conflict" }
memory-episodic = { path = "crates/memory-episodic" }
memory-graph = { path = "crates/memory-graph" }
memory-procedural = { path = "crates/memory-procedural" }
memory-prospective = { path = "crates/memory-prospective" }
memory-lifecycle = { path = "crates/memory-lifecycle" }
provider-pgvector = { path = "crates/providers/provider-pgvector" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
