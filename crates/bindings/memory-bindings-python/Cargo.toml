[package]
name = "memory-bindings-python"
description = "Python bindings for the Barq memory engine (agent_memory module)."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/YASSERRMD/barq-agentic-memory"
rust-version = "1.85"

[lib]
name = "agent_memory"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Maturin builds wheels with this feature; plain cargo test links libpython instead.
extension-module = ["pyo3/extension-module"]

[dependencies]
memory-core = { path = "../../memory-core" }
memory-domain = { path = "../../memory-domain" }
memory-retrieval = { path = "../../memory-retrieval" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
pyo3 = { version = "0.23", features = ["chrono", "serde"] }

[dev-dependencies]
tempfile = "3"
