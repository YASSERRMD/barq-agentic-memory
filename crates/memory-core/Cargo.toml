[package]
name = "memory-core"
description = "Provider registry, engine assembly, and the MemoryEngine facade for the Barq memory engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "dep:provider-postgres"]
redis = ["dep:provider-redis"]

[dependencies]
memory-domain.workspace = true
memory-provider-api.workspace = true
provider-local.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
provider-postgres = { workspace = true, optional = true }
provider-redis = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
